<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E5A42">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Organoleptic">
<title>Daily Organoleptic Report</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --canvas:#FAF8F5; --card:#FFFFFF; --bd:#E7E2DA; --ink:#1F1B16; --mute:#6B645A;
  --emerald:#0E5A42; --emerald-soft:#E8F3EE; --rose:#B84A62; --rose-soft:#FDF2F5;
  --accent:var(--emerald); --accent-soft:var(--emerald-soft); --r:14px;
  --g-bg:#E4F3EA; --g-fg:#1B6B45; --a-bg:#FFF1D6; --a-fg:#8A5A00; --r-bg:#FCE4E8; --r-fg:#A3162F; --n-bg:#EFEBE5; --n-fg:#5B554C;
}
body[data-mode="on"]{ --accent:var(--rose); --accent-soft:var(--rose-soft); }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--canvas);color:var(--ink);font:16px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,select,input,textarea{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;min-height:100dvh}
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--bd)}
.strip h1{font-size:18px;margin:0 auto 0 0;color:var(--emerald);white-space:nowrap}
body[data-mode="on"] .strip h1{color:var(--rose)}
.strip select,.strip input{height:44px;border:1.5px solid var(--bd);border-radius:12px;padding:0 10px;background:#fff;font-size:16px}
#shift{width:118px}#op{width:150px}#batch{width:150px;text-transform:uppercase}
.tag{border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;background:var(--emerald-soft);color:var(--emerald)}
.tag.off{background:var(--r-bg);color:var(--r-fg)}
.tag.q{background:var(--a-bg);color:var(--a-fg)}
.hide{display:none!important}
.seg{display:grid;grid-template-columns:1fr 1fr;margin:10px 12px 0;border:1.5px solid var(--bd);border-radius:var(--r);overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;min-height:54px;padding:6px 10px;text-align:center;cursor:pointer;line-height:1.15}
.seg button b{display:block;font-size:17px}.seg button span{font-size:14px;color:var(--mute)}
.seg button[aria-pressed="true"]{color:#fff}.seg button[aria-pressed="true"] span{color:#fff;opacity:.9}
#modeOff[aria-pressed="true"]{background:var(--emerald)}#modeOn[aria-pressed="true"]{background:var(--rose)}
main{flex:1;display:flex;flex-direction:column;gap:10px;padding:10px 12px 12px}
.col{display:flex;flex-direction:column;gap:10px;min-height:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:10px 12px}
.lbl{font-size:13px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{min-height:44px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--bd);background:#fff;font-weight:600;font-size:16px;cursor:pointer;text-align:center;line-height:1.15}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.pill.suggest{outline:3px solid var(--a-fg);outline-offset:1px}
.pill.empty{color:var(--mute);border-style:dashed}
#sku .pill{border-radius:12px}
.skuwrap{min-height:0}
.note{background:var(--a-bg);color:var(--a-fg);border-radius:12px;padding:10px 12px;font-size:15px;font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.reading label{display:block}
.reading input{width:100%;height:52px;font-size:30px;font-weight:700;text-align:center;border:1.5px solid var(--bd);border-radius:12px;background:#fff}
.reading input:focus,.tx:focus,textarea:focus{outline:3px solid var(--accent-soft);border-color:var(--accent)}
.badge{display:inline-block;margin-top:6px;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:800}
.spec{font-size:14px;color:var(--mute);margin-top:4px;min-height:18px}
.GREEN{background:var(--g-bg);color:var(--g-fg)}.AMBER{background:var(--a-bg);color:var(--a-fg)}.RED{background:var(--r-bg);color:var(--r-fg)}.NA,.MISSING{background:var(--n-bg);color:var(--n-fg)}
#overall{border-radius:12px;text-align:center;font-weight:900;font-size:22px;padding:12px 8px}
.voice{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
#mic{height:52px;border:0;border-radius:var(--r);background:var(--accent);color:#fff;font-size:19px;font-weight:800;cursor:pointer}
#mic.live{background:var(--r-fg);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.75}}
#lang{height:52px;border:1.5px solid var(--bd);border-radius:12px;padding:0 8px;background:#fff}
textarea{width:100%;border:1.5px solid var(--bd);border-radius:12px;padding:10px;background:#fff;resize:none;font-size:17px}
#tx{height:48px;margin-top:8px}#remark{height:48px}#ca{height:48px}
#vwarn{margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{min-height:44px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--bd);background:var(--card);font-weight:600;cursor:pointer}
.actions{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.actions button{height:56px;border-radius:var(--r);font-size:19px;font-weight:800;cursor:pointer;border:1.5px solid var(--bd);background:#fff}
#log{background:var(--accent);border-color:var(--accent);color:#fff}
#log:disabled{opacity:.4}
.link{height:44px;border:1.5px solid var(--bd);border-radius:12px;background:#fff;padding:0 14px;font-weight:700;cursor:pointer}
.rec{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0;border-bottom:1px solid var(--bd)}
.rec:last-child{border:0}
#manualWrap input{width:100%;height:48px;border:1.5px solid var(--bd);border-radius:12px;padding:0 12px;font-size:17px;margin-top:8px}
#toast{position:fixed;left:12px;right:12px;bottom:12px;background:#1F1B16;color:#fff;padding:14px;border-radius:12px;display:none;z-index:9;font-weight:700}
/* Landscape / tablet workspace: fits one screen, no page scroll */
@media (min-width:1024px){
  html,body{overflow:hidden}
  #app{height:100dvh;min-height:0}
  main{display:grid;grid-template-columns:5fr 6fr;min-height:0}
  .col{overflow:auto}
  .actions{position:sticky;bottom:0;background:var(--canvas);padding-top:6px}
  .card{padding:8px 12px}
  .skuwrap{flex:1;overflow:auto}
}
@media (max-width:679px){
  .strip h1{font-size:16px;flex-basis:100%}
  #shift,#op,#batch{flex:1 1 30%;width:auto}
  .seg button b{font-size:15px}.seg button span{font-size:12px}
  .reading input{font-size:28px}
}
</style>
</head>
<body data-mode="off">
<div id="app">
  <div class="strip">
    <h1>Daily Organoleptic Report</h1>
    <select id="shift" aria-label="Shift"><option>Morning</option><option>Afternoon</option><option>Night</option></select>
    <input id="op" placeholder="QA operator" autocomplete="off" aria-label="QA operator">
    <input id="batch" placeholder="Batch code" autocomplete="off" autocapitalize="characters" aria-label="Batch code">
    <span id="net" class="tag">Online</span>
    <span id="qn" class="tag q hide">Queue 0</span>
    <button id="retry" type="button" class="link hide">Retry</button>
  </div>
  <div class="seg" role="group" aria-label="Private Labeling">
    <button id="modeOff" type="button" aria-pressed="true"><b>Private Labeling: OFF</b><span>Barakat House Brands</span></button>
    <button id="modeOn" type="button" aria-pressed="false"><b>Private Labeling: ON</b><span>Contract Brands</span></button>
  </div>
  <main>
    <div class="col">
      <div class="card"><div class="lbl">Stream</div><div id="stream" class="pills"></div>
        <div id="subWrap" style="margin-top:10px"><div class="lbl">Sub-category</div><div id="sub" class="pills"></div></div></div>
      <div class="card skuwrap"><div class="lbl">SKU &mdash; tap, or read the name aloud</div>
        <div id="sku" class="pills"></div>
        <div id="manualWrap" class="hide"><div id="streamNote" class="note"></div>
          <input id="manualSku" placeholder="SKU name (manual entry, no limits)" autocomplete="off" aria-label="Manual SKU name"></div>
        <div id="cands" class="pills" style="margin-top:8px"></div></div>
      <div class="card"><div class="lbl">Recent (this device)</div><div id="recent"></div></div>
    </div>
    <div class="col">
      <div class="card">
        <div class="voice"><button id="mic" type="button">&#127908; Tap to Speak</button>
          <select id="lang" aria-label="Language"><option value="en-AE">EN (UAE)</option><option value="en-GB">EN (UK)</option><option value="en-US">EN (US)</option></select></div>
        <textarea id="tx" class="tx" placeholder='Say: "Green Apple Mint Lemon brix 11.2 ph 3.8 normal"' aria-label="Transcript"></textarea>
        <div id="vwarn" class="note hide"></div>
        <button id="parse" type="button" class="link hide">Parse</button>
      </div>
      <div class="card">
        <div class="row2">
          <div class="reading"><div class="lbl">Brix</div><input id="brix" inputmode="decimal" autocomplete="off" aria-label="Brix">
            <span id="bs" class="badge NA">&mdash;</span><div id="bspec" class="spec"></div></div>
          <div class="reading"><div class="lbl">pH</div><input id="ph" inputmode="decimal" autocomplete="off" aria-label="pH">
            <span id="ps" class="badge NA">&mdash;</span><div id="pspec" class="spec"></div></div>
        </div>
      </div>
      <div id="verdictCard" class="card"><div class="lbl">QC Evaluation Verdict</div><div id="overall" class="NA">&mdash;</div></div>
      <div class="card">
        <div class="lbl">Organoleptic</div>
        <div id="remchips" class="chips" style="margin-top:0"></div>
        <textarea id="remark" aria-label="Organoleptic remark" placeholder="Remark"></textarea>
        <div id="cawrap" class="hide"><div class="lbl" style="color:var(--r-fg);margin-top:8px">Corrective action / HOLD (required for RED)</div>
          <textarea id="ca" placeholder="e.g. Batch on HOLD, re-tested, QA notified"></textarea></div>
      </div>
      <div class="actions"><button id="clearBtn" type="button">Clear</button><button id="log" type="button">Log QC Result</button></div>
    </div>
  </main>
</div>
<div id="toast"></div>

  rec.onerror = function (e) { if (e.error !== 'no-speech' && e.error !== 'aborted') toast('Mic error: ' + e.error, 4000); };
  rec.onend = function () { clearTimeout(silenceTimer); micUI(false); if ($('tx').value.trim()) { applyParse($('tx').value); if (navigator.vibrate) navigator.vibrate(60); } };
  try { rec.start(); micUI(true); silenceTimer = setTimeout(function () { try { rec.stop(); } catch (e3) {} }, CONFIG.INITIAL_GRACE_MS); }
  catch (err) { toast('Could not start mic: ' + err.message, 4000); }
}

// ---- offline queue + posting ----
function getQueue() { return lsGet(CONFIG.QUEUE_KEY, []); }
function setQueue(q) { lsSet(CONFIG.QUEUE_KEY, q); renderNet(); }
function renderNet() {
  var q = getQueue().length, online = navigator.onLine !== false;
  $('net').textContent = online ? 'Online' : 'Offline'; $('net').className = 'tag' + (online ? '' : ' off');
  $('qn').textContent = 'Queue ' + q; $('qn').classList.toggle('hide', q === 0);
  $('retry').classList.toggle('hide', q === 0);
}
function postRecords(records) {
  return fetch(CONFIG.WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ records: records }) })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (!j || j.status !== 'success') throw new Error((j && j.message) || 'Server error'); return j; });
}
function flushQueue(silent) {
  var q = getQueue(); if (!q.length) return Promise.resolve();
  return postRecords(q).then(function () { setQueue([]); if (!silent) toast('Queued entries sent (' + q.length + ')'); })
    .catch(function () { if (!silent) toast('Still offline — entries kept in queue.'); });
}
function addRecent(r) { var a = lsGet(CONFIG.RECENT_KEY, []); a.unshift({ t: r.Timestamp, sku: r.SKU_Name, st: r.Overall_Status }); lsSet(CONFIG.RECENT_KEY, a.slice(0, 3)); renderRecent(); }
function renderRecent() {
  var a = lsGet(CONFIG.RECENT_KEY, []);
  $('recent').innerHTML = a.length ? a.map(function (x) { return '<div class="rec"><span>' + esc(x.t.slice(11, 16)) + ' ' + esc(x.sku) + '</span><span class="badge ' + esc(x.st === 'N/A' ? 'NA' : x.st) + '" style="margin:0;padding:2px 10px">' + esc(x.st) + '</span></div>'; }).join('') : '<span style="color:var(--mute);font-size:14px">No entries yet.</span>';
}

function logResult() {
  var sku = activeSku();
  if (!sku) { toast('Tap a SKU first.'); return; }
  if (!sku.name) { toast('Type the SKU name for manual entry.'); $('manualSku').focus(); return; }
  var brix = readNum('brix'), ph = readNum('ph');
  if (brix === null && ph === null && !$('remark').value.trim()) { toast('Enter Brix, pH or an organoleptic remark.'); return; }
  var a = Q.assess(sku, brix, ph, state.hold);
  var remark = $('remark').value.trim();
  if (a.overall === 'RED') {
    var ca = $('ca').value.trim();
    if (ca.length < 3) { toast('RED result: enter the corrective action / HOLD before logging.', 4500); $('ca').focus(); return; }
    remark = (remark ? remark + ' | ' : '') + 'CORRECTIVE ACTION/HOLD: ' + ca;
  }
  var now = new Date();
  var rec = {
    Timestamp: stamp(now), Date: dateOnly(now), Shift: $('shift').value, Operator: $('op').value.trim(), Batch_Code: $('batch').value.trim(),
    Stream: sku.stream || state.stream, Sub_Category: sku.sub, SKU_Name: sku.name,
    Measured_Brix: brix === null ? '' : brix, Brix_Spec: a.brixSpec, Brix_Status: (a.brix === 'MISSING' || a.brix === 'NA') ? 'N/A' : a.brix,
    Measured_pH: ph === null ? '' : ph, pH_Spec: a.phSpec, pH_Status: (a.ph === 'MISSING' || a.ph === 'NA') ? 'N/A' : a.ph,
    Overall_Status: a.overall === 'NA' ? 'N/A' : a.overall, Organoleptic_Remark: remark, Raw_Transcript: $('tx').value.trim()
  };
  lsSet(CONFIG.OP_KEY, rec.Operator);
  $('log').disabled = true;
  postRecords([rec]).then(function () { toast('Logged ✓ ' + rec.SKU_Name + ' – ' + rec.Overall_Status); addRecent(rec); flushQueue(true); })
    .catch(function () { var q = getQueue(); q.push(rec); setQueue(q); addRecent(rec); toast('Saved offline – will send when online.'); })
    .then(function () { $('log').disabled = false; resetEntry(true); });
}
function resetEntry(afterLog) {
  ['tx','brix','ph','remark','ca'].forEach(function (id) { $(id).value = ''; });
  $('manualSku').value = '';
  state.hold = false; clearSuggest(); $('vwarn').classList.add('hide');
  if (afterLog) { state.sku = null; renderSkus(); }   // force a fresh SKU tap so a reading is never logged against the previous SKU
  refresh(); renderNet();
}

// ---- init ----
function init() {
  var saved = lsGet(CONFIG.UI_KEY, null);
  if (saved && Q.MODES[saved.mode]) {
    state.mode = saved.mode;
    if (Q.MODES[saved.mode].streams.indexOf(saved.stream) >= 0) { state.stream = saved.stream; state.sub = Q.subsOf(saved.stream).indexOf(saved.sub) >= 0 ? saved.sub : (Q.subsOf(saved.stream)[0] || ''); }
    else { state.stream = Q.MODES[saved.mode].streams[0]; state.sub = Q.subsOf(state.stream)[0] || ''; }
  }
  $('shift').value = defaultShift(); $('op').value = lsGet(CONFIG.OP_KEY, '') || '';
  var chips = [['OK','normal'],['Watery','watery'],['Pulpy','pulpy'],['Sour','sour'],['Fermented – HOLD','fermented'],['Color off','discolored']];
  chips.forEach(function (c) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = c[0];
    b.onclick = function () { var r = Q.parseRemarks(c[1]); var cur = $('remark').value.trim(); if (r.text && cur.indexOf(r.text) < 0) $('remark').value = cur ? cur + '; ' + r.text : r.text; if (r.hold) state.hold = true; refresh(); };
    $('remchips').appendChild(b);
  });
  $('modeOff').onclick = function () { setMode('off'); }; $('modeOn').onclick = function () { setMode('on'); };
  $('brix').oninput = refresh; $('ph').oninput = refresh; $('manualSku').oninput = refresh;
  $('remark').oninput = function () { state.hold = /HOLD/.test($('remark').value); refresh(); };
  $('mic').onclick = startVoice; $('parse').onclick = function () { applyParse($('tx').value); };
  $('tx').onchange = function () { applyParse($('tx').value); };
  $('log').onclick = logResult; $('clearBtn').onclick = function () { resetEntry(false); }; $('retry').onclick = function () { flushQueue(false); };
  window.addEventListener('online', function () { renderNet(); flushQueue(true); }); window.addEventListener('offline', renderNet);
  renderMode(); renderStreams(); renderSubs(); renderSkus(); renderNet(); renderRecent(); refresh(); flushQueue(true);
  try { if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js'); } catch (e) {}
}
init();
})();
</script>
